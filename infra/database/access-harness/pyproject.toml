[project]
name = "access-harness"
version = "0.1.0"
description = "Access Fidelity Harness - mirrors Microsoft Access into Postgres for fidelity validation"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]",
    "pyodbc",
    # pywin32 ships ONLY Windows wheels; gate it with a PEP 508 environment
    # marker so dependency resolution (uv sync / uv run pytest) succeeds on
    # Linux/macOS too.  win32com is lazy-imported only inside
    # extract.connect_ace (Windows-only path), so non-Windows never needs it.
    "pywin32 ; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
