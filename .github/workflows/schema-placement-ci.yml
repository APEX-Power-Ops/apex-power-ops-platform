# .github/workflows/schema-placement-ci.yml
# Path-filtered gate for the schema-placement disposition ledger. Runs the four locked offline suites
# (no DB — the collector's live census path is GO-gated and stubbed in tests) plus a whitespace /
# conflict-marker check, so a PR touching this tooling cannot merge on unrelated green checks.
name: Schema-placement CI

on:
  push:
    paths:
      - infra/database/schema-placement/**
      - .github/workflows/schema-placement-ci.yml

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install uv
        run: python -m pip install --upgrade pip && python -m pip install uv
      - name: Offline suites (locked)
        working-directory: infra/database/schema-placement
        run: |
          for t in test_disposition_schema test_check_disposition test_collect_disposition test_verify_census; do
            echo "=== $t ==="
            uv run --project . --locked python "tests/$t.py"
          done
      - name: Whitespace / conflict-marker check (committed tooling)
        run: |
          EMPTY=$(git hash-object -t tree /dev/null)
          git diff --check "$EMPTY" HEAD -- infra/database/schema-placement
