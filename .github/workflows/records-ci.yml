# .github/workflows/records-ci.yml
name: Records CI

on:
  push:
    paths:
      - packages/power-test-converters/**
      - packages/records-import/**
      - infra/secret-audit.sh
      - infra/database/migrations/records/**
      - apps/control-plane-api/scripts/run_platform_api_local.sh
      - apps/control-plane-api/scripts/test_run_platform_api_local.sh
      - .github/workflows/records-ci.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          # Throwaway literal: job-scoped container, unreachable from outside
          # the runner, holds only disposable validation data.
          POSTGRES_PASSWORD: records_ci_throwaway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RECORDS_PG_ADMIN_DSN: host=127.0.0.1 port=5432 dbname=postgres user=postgres password=records_ci_throwaway sslmode=disable
      NETA_DATA_DIR: ${{ github.workspace }}/neta-source/Development/NETA-Data
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Checkout NETA source extracts (private repo, read-only token)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: APEX-Power-Ops/neta-ett-study-material
          ref: 7f162df1150912d8bbe5024aa352939db5663fa4
          token: ${{ secrets.NETA_SOURCE_REPO_TOKEN }}
          path: neta-source
          # Codex cross-engine P1: never persist the token into .git/config -
          # job code must be able to read the extracts, never the credential.
          persist-credentials: false
      - name: Verify required extract files by name (never content)
        run: |
          for f in NETA-Master-Equipment-Table-Enhanced.json NETA-ATS-2025-equipment-tests-v2.json NETA-ATS-2025-tables-extracted.json NETA-MTS-2023-tables-extracted.json; do
            test -f "$NETA_DATA_DIR/$f" && echo "present: $f" || { echo "MISSING: $f"; exit 1; }
          done
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install packages (ordered - see records-import pyproject comment)
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/power-test-converters
          pip install -e "packages/records-import[test]"
      - name: Harness unit tests (the gate's own tests)
        run: python -m pytest infra/database/migrations/records/test__dbtest_helper.py infra/database/migrations/records/test_run_validation_unit.py -q
      - name: AC8 secret-audit fixture test (records serving config)
        run: bash infra/database/migrations/records/test_secret_audit_ac8.sh
      - name: Secret-audit env allowlist fixture test
        run: bash infra/database/migrations/records/test_secret_audit_env_allowlist.sh
      - name: cache-coverage fixture test (Check 1d)
        run: bash infra/database/migrations/records/test_secret_audit_cache_coverage.sh
      - name: Control-plane launcher argv contract test
        run: bash apps/control-plane-api/scripts/test_run_platform_api_local.sh
      - name: Run the records validation gate
        run: python infra/database/migrations/records/run_validation.py --require-db
