name: PM/Ops P0 Tooling CI

on:
  push:
    paths:
      - apps/mutation-seam/scripts/pm_ops_p0/**
      - .github/workflows/pm-ops-p0-tooling.yml
  pull_request:
    paths:
      - apps/mutation-seam/scripts/pm_ops_p0/**
      - .github/workflows/pm-ops-p0-tooling.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mutation-seam/scripts/pm_ops_p0
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned tooling dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.0.3 ruff==0.15.15
      - name: Ruff lint + format check
        run: |
          ruff check .
          ruff format --check .
      - name: Offline test suite (no live database)
        run: pytest tests -q
