name: Calc Engine CI

on:
  push:
    paths:
      - packages/calc-engine/**
      - .github/workflows/calc-engine-ci.yml
  pull_request:
    paths:
      - packages/calc-engine/**
      - .github/workflows/calc-engine-ci.yml

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/calc-engine
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install package test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test]
      - name: Syntax compile extracted package
        run: python -m compileall src tests
      - name: Run offline calc fixture tests
        run: pytest tests/test_golden_fixtures.py -q