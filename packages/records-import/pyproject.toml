[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "records-import"
version = "0.1.0"
description = "Capture-mode import: instrument file -> records datasheet (Chip 10)"
requires-python = ">=3.11"
# power-test-converters is a sibling lane package (read_ptm); it is provided at test/run time via
# `uv ... --with-editable packages/power-test-converters` (matches the lane's standalone-package
# convention - no PyPI index entry). psycopg is the only external dependency.
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
test = ["pytest>=8.0.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
