[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "power-test-converters"
version = "0.1.0"
description = "Transformer test file converters for field workflows"
requires-python = ">=3.11"

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]

[project.scripts]
ptm-to-dtax = "power_test_converters.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
